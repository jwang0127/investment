name: daily-dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # GitHub Actions 使用 UTC；北京时间 18:00 对应 10:00 UTC。
    - cron: '0 10 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

# push 与 schedule 可能并发触发，串行执行避免 git push 竞态。
concurrency:
  group: daily-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      # 先跑离线测试，模型/闭环回归失败时不发布错误报告
      - run: PYTHONPATH=src python -m pytest tests/ -q
      # 320 天日线保证 250 日量能分位窗口能填满
      - run: PYTHONPATH=src python -m investment_dashboard.cli --days 320
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          NEWS_API_URL: ${{ secrets.NEWS_API_URL }}
      - name: Save model journal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/prediction_journal.jsonl data/last_success.json data/industry_history.csv; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          git diff --cached --quiet || (git commit -m "chore: update daily model journal [skip ci]" && git pull --rebase origin main && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
